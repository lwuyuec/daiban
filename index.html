<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="待办工作台：本地优先的待办清单，支持标签、优先级、截止日期与截图附件。">
<meta name="theme-color" content="#F4F3EF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235A57D6'/%3E%3Cpath d='M16 33l10 10 22-23' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>待办工作台</title>
<link rel="stylesheet" href="./styles.css">
<script src="./app.js" defer></script>
</head>
<body>

<div class="lock-screen" id="lockScreen" aria-hidden="true">
  <div class="lock-card" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lock-mark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10" width="15" height="10.5" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h2 id="lockTitle">设置访问密码</h2>
    <p id="lockDesc">首次使用请设置密码，之后打开此页面需要输入。</p>
    <input type="password" id="lockPwd" maxlength="64" placeholder="访问密码" aria-label="访问密码" autocomplete="current-password">
    <input type="password" id="lockPwd2" maxlength="64" placeholder="再次输入密码" aria-label="确认访问密码" autocomplete="new-password">
    <button class="btn primary" id="lockBtn" type="button">设置并进入</button>
    <div class="lock-error" id="lockError" role="alert"></div>
    <div class="lock-foot">密码以加盐哈希保存在本浏览器，不会上传。</div>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12.5l5 5 11-11"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>待办工作台</h1>
        <p>Todo Workspace</p>
      </div>
    </div>

    <div>
      <div class="side-label">视图</div>
      <nav class="nav" id="nav" aria-label="待办视图"></nav>
    </div>

    <div>
      <div class="side-label">标签</div>
      <div class="tags" id="tagList"></div>
    </div>

    <div class="side-foot">
      <button class="ghost-btn" id="exportBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
        导出备份 (JSON)
      </button>
      <button class="ghost-btn" id="importBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17V5"/><path d="M7 10l5-5 5 5"/><path d="M5 20h14"/></svg>
        导入备份 (JSON)
      </button>
      <input type="file" id="importInput" accept=".json,application/json" hidden>
      <button class="ghost-btn" id="clearDoneBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
        清除已完成
      </button>
      <div class="storage-note">数据保存在本机浏览器，不上传服务器。</div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <div class="greet" id="greet">GOOD MORNING</div>
        <h2>我的待办<span id="dateText"></span></h2>
      </div>
      <div class="top-actions">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="搜索待办、备注、标签" aria-label="搜索待办">
          <kbd>⌘K</kbd>
        </div>
        <button class="btn primary" id="newBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          新建待办
        </button>
      </div>
    </div>

    <div class="quick">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      <input id="quickInput" placeholder="快速添加待办，按 Enter 创建；截图可直接 Ctrl+V 粘贴" aria-label="快速添加待办">
      <button class="mini" id="quickBtn" type="button">添加</button>
    </div>

    <div class="sync-bar">
      <span class="sync-dot" id="syncDot" aria-hidden="true"></span>
      <span class="sync-status" id="syncStatus">正在检查共享看板…</span>
      <label class="sr-only" for="boardInput">协作空间名称</label>
      <input id="boardInput" maxlength="40" placeholder="协作空间" aria-label="协作空间名称">
      <button class="sync-copy" id="copyShareBtn" type="button">复制协作链接</button>
    </div>

    <div class="stats">
      <div class="stat"><span class="k">进行中</span><span class="v" id="stActive">0<small>项</small></span></div>
      <div class="stat"><span class="k">今天 / 逾期</span><span class="v" id="stToday">0<small>项</small></span></div>
      <div class="stat"><span class="k">已完成</span><span class="v" id="stDone">0<small>项</small></span></div>
      <div class="stat pg">
        <div class="ring" id="ring" style="--p:0"><b id="ringTxt">0%</b></div>
        <div class="pg-body">
          <span class="k">整体完成进度</span>
          <div class="bar"><i id="barFill"></i></div>
        </div>
      </div>
    </div>

    <section class="board">
      <div class="board-head">
        <h3 id="listTitle">全部待办</h3>
        <span class="sub" id="listCount"></span>
        <div class="sort-wrap">
          <select id="sortSel" aria-label="排序方式">
            <option value="created">按创建时间</option>
            <option value="due">按截止日期</option>
            <option value="priority">按优先级</option>
          </select>
        </div>
      </div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty">
        <div class="ico">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><path d="M8 9.5h8"/><path d="M8 13h5"/></svg>
        </div>
        <b id="emptyTitle">这里还没有待办</b>
        <p id="emptyDesc">点击右上角「新建待办」，支持直接粘贴截图</p>
      </div>
    </section>
  </main>
</div>

<!-- 新建 / 编辑 -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h3 id="sheetTitle">新建待办</h3>
      <span class="esc">ESC 取消</span>
    </div>
    <div class="sheet-body">
      <input class="title-input" id="fTitle" maxlength="120" placeholder="要做什么？" aria-label="待办标题">
      <textarea class="note" id="fNote" maxlength="2000" placeholder="补充说明（可选）：目标、验收标准、链接…" aria-label="补充说明"></textarea>

      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <div class="dz-hint" id="dzHint">
          <div class="kbd-row">
            <kbd class="key">Ctrl</kbd><span>/</span><kbd class="key">⌘</kbd><span>+</span><kbd class="key">V</kbd>
            <span>粘贴图片</span>
          </div>
          <p>也可以把截图拖进来，或 <button class="link" id="pickBtn" type="button">选择本地图片</button></p>
        </div>
        <div class="thumbs" id="thumbs"></div>
        <div class="dz-foot">
          <span id="imgCount">0 张图片</span>
          <button class="paste-again" id="pickBtn2" type="button">+ 继续添加</button>
        </div>
      </div>

      <div class="meta-grid">
        <div class="field">
          <label for="seg">优先级</label>
          <div class="seg" id="seg">
            <button type="button" data-v="high">高</button>
            <button type="button" data-v="medium" class="on">中</button>
            <button type="button" data-v="low">低</button>
          </div>
        </div>
        <div class="field">
          <label for="fDue">截止日期</label>
          <input type="date" class="inp" id="fDue">
        </div>
        <div class="field tags-field">
          <label for="fTags">标签</label>
          <input class="inp" id="fTags" placeholder="逗号分隔，如 工作, 设计">
        </div>
      </div>
    </div>
    <div class="sheet-foot">
      <span class="hint">Ctrl / ⌘ + Enter 保存</span>
      <button class="btn ghost" id="cancelBtn" type="button">取消</button>
      <button class="btn primary" id="saveBtn" type="button">保存待办</button>
    </div>
  </div>
</div>

<!-- 图片查看 -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lb-bar">
    <button class="lb-btn" id="lbDownload" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
      保存图片
    </button>
    <button class="lb-btn" id="lbClose" type="button">关闭 ESC</button>
  </div>
  <img id="lbImg" alt="待办图片">
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

</body>
</html>
